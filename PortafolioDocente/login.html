<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Aula Virtual</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f0f2f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login{
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,.2);
    width:350px;
    text-align:center;
}

input{
    width:90%;
    padding:12px;
    margin:10px 0;
}

button{
    background:#0066cc;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:5px;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="login">
    <h2>Portafolio Docente</h2>
    <p>Acceso para docentes</p>

    <input type="text" placeholder="Usuario">
    <input type="password" placeholder="Contraseña">

    <button onclick="window.location.href='portafolio.html'">
        Ingresar
    </button>
</div>

</body>
</html>
